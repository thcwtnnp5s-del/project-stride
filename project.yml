# Project Stride — Xcode project specification
#
# The .xcodeproj is generated from this file rather than committed, so the
# project structure is reviewable as text instead of an opaque pbxproj that
# conflicts on every branch.
#
#   brew install xcodegen
#   xcodegen generate
#
# XcodeGen is a build-time tool, not a runtime dependency. DECISIONS/0002's
# "no dependencies" rule governs what ships in the app; this ships nothing.
#
# If you would rather not use it, TECHNICAL/PROJECT_SETUP.md documents creating
# the same project by hand in Xcode. Either path produces an identical target
# layout.

name: Stride

options:
  bundleIdPrefix: com.projectstride
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only — DECISIONS/0009
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

packages:
  StrideCore:
    path: StrideCore

targets:
  Stride:
    type: application
    platform: iOS
    sources:
      - path: App/Stride
    info:
      path: App/Stride/Info.plist
    dependencies:
      - package: StrideCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectstride.stride
        INFOPLIST_FILE: App/Stride/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

  StrideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/StrideTests
    dependencies:
      - target: Stride
      - package: StrideCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectstride.stride.tests

schemes:
  Stride:
    build:
      targets:
        Stride: all
    test:
      targets:
        - StrideTests
      gatherCoverageData: true

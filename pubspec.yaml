name: stride
description: >-
  Project Stride — a step-powered asynchronous RPG with idle-style planning.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  stride_core:
    path: packages/stride_core
  stride_health:
    path: packages/stride_health
  # The iOS Keychain identity and NSURLIsExcludedFromBackupKey, behind a typed
  # Pigeon port. iOS-only implementation; Android keeps app-private files and
  # its declarative backup exclusions.
  stride_secure_store:
    path: packages/stride_secure_store
  stride_storage:
    path: packages/stride_storage
  # The only way to reach an application-support directory from Flutter.
  # It touches no health data and reads no content; it returns a path.
  path_provider: ^2.1.5

# No third-party health aggregation package may appear here or in any other
# pubspec. Health integration is first-party, in packages/stride_health.
# Enforced by the dependency-policy job in CI.
# See DECISIONS/0010_CROSS_PLATFORM_STACK.md.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # On-device restart checks. Never a dependency of the app itself.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Declared file by file, not as a directory glob.
  #
  # A glob would silently start shipping whatever someone drops in, and the
  # loader validates exactly the files it is handed -- so an undeclared file
  # is content that does not exist, and a stray one is content nobody
  # reviewed. The version prefix is in the path so a v2 pack can ship beside
  # v1 rather than replacing it.
  assets:
    - assets/content/v1/enemies.json
    - assets/content/v1/items.json
    - assets/content/v1/locations.json
    - assets/content/v1/profiles.json
    - assets/content/v1/recipes.json
    - assets/content/v1/resource_nodes.json
    - assets/content/v1/skills.json

    # Pixel content, v1. Same rule as content above, and for the same reason: an
    # undeclared file is an asset that does not exist, and a stray one is an
    # asset nobody reviewed.
    #
    # Every file here is drawn through `PixelAsset`, at an exact integer multiple
    # of its native size, with nearest-neighbour filtering (ART_DIRECTION L-18).
    # The native size lives in the widget, not in the path — there are
    # deliberately no 2.0x/ or 3.0x/ variant directories, because AssetImage
    # would resolve those by devicePixelRatio and change the intrinsic size out
    # from under the explicit width.
    #
    # Provenance and the temporary marks are in assets/ui/v1/README.md.
    - assets/ui/v1/nav_adventure.png
    - assets/ui/v1/nav_adventure_hi.png
    - assets/ui/v1/nav_character.png
    - assets/ui/v1/nav_character_hi.png
    - assets/ui/v1/nav_skills.png
    - assets/ui/v1/nav_inventory.png
    - assets/ui/v1/nav_inventory_hi.png
    - assets/ui/v1/nav_craft.png
    - assets/ui/v1/nav_world.png
    - assets/ui/v1/glyph_steps.png
    - assets/ui/v1/glyph_steps_muted.png
    - assets/ui/v1/glyph_arrow.png
    - assets/ui/v1/skill_foraging.png
    - assets/ui/v1/item_meadow_herb.png
    - assets/ui/v1/item_training_sword.png
    - assets/ui/v1/item_training_axe.png
    - assets/ui/v1/item_training_pickaxe.png
    - assets/ui/v1/item_traveler_tunic.png
    - assets/ui/v1/item_unknown.png
    - assets/ui/v1/activity_meadow_patch.png
    # TEMPORARY PLACEHOLDER. The character portrait workstream is paused and this
    # asset is explicitly replaceable — CHARACTER_PORTRAIT_CLOSEOUT.md governs
    # it. Nothing about any layout depends on its content.
    - assets/ui/v1/portrait_traveler.png

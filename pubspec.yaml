    - assets/art/v1/item/boar_tusk.png
    - assets/art/v1/item/bear_pelt.png
    - assets/art/v1/item/ram_horn.png
    - assets/art/v1/item/oak_plank.png
    - assets/art/v1/item/scrap_metal.png
    - assets/art/v1/item/heat_scale.png
    - assets/art/v1/item/ram_wool.png
    - assets/art/v1/item/boar_hide.png
    - assets/art/v1/item/reinforced_pickaxe.png
    - assets/art/v1/item/pristine_wolf_fang.png
    - assets/art/v1/item/great_tusk.png
    - assets/art/v1/item/goblin_toolhead.png
    - assets/art/v1/item/ember_core.png
    - assets/art/v1/item/frost_claw.png
    - assets/art/v1/item/pristine_horn.png
    # Transformation Build 01 — whole-directory families. These four are
    # generated in bulk by the packaging script (185 ambient frames, the atlas
    # base + landmarks, 29 env sprites, 8 node vignettes), and the script's
    # `--check` is what guards their contents; listing each file here would be
    # a second copy of that manifest that drifts.
    - assets/art/v1/ambient/
    - assets/art/v1/combat/
    - assets/art/v1/world/
    - assets/art/v1/env/
    - assets/art/v1/node/
    - assets/art/v1/work/
    - assets/art/v1/portrait/traveler.png
    - assets/art/v1/sprite/traveler_south.png
    - assets/art/v1/anim/gather_f0.png
    - assets/art/v1/anim/gather_f1.png
    - assets/art/v1/anim/gather_f2.png
    - assets/art/v1/anim/gather_f3.png
    - assets/art/v1/anim/gather_f4.png
    - assets/art/v1/anim/gather_f5.png
    - assets/art/v1/anim/gather_f6.png
    - assets/art/v1/anim/gather_f7.png
    - assets/art/v1/location/havens_rest.png

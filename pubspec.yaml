name: stride
description: >-
  Project Stride — a step-powered asynchronous RPG with idle-style planning.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  stride_core:
    path: packages/stride_core
  stride_health:
    path: packages/stride_health
  # The iOS Keychain identity and NSURLIsExcludedFromBackupKey, behind a typed
  # Pigeon port. iOS-only implementation; Android keeps app-private files and
  # its declarative backup exclusions.
  stride_secure_store:
    path: packages/stride_secure_store
  stride_storage:
    path: packages/stride_storage
  # The only way to reach an application-support directory from Flutter.
  # It touches no health data and reads no content; it returns a path.
  path_provider: ^2.1.5
  # The presentation audio layer's one plugin: region music and profession
  # action cues (AUDIO_PRESENTATION_01). Pinned exactly; the record of why —
  # and what it may never own — is in DEPENDENCIES.md.
  audioplayers: 6.8.1

# No third-party health aggregation package may appear here or in any other
# pubspec. Health integration is first-party, in packages/stride_health.
# Enforced by the dependency-policy job in CI.
# See DECISIONS/0010_CROSS_PLATFORM_STACK.md.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # On-device restart checks. Never a dependency of the app itself.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Declared file by file, not as a directory glob.
  #
  # A glob would silently start shipping whatever someone drops in, and the
  # loader validates exactly the files it is handed -- so an undeclared file
  # is content that does not exist, and a stray one is content nobody
  # reviewed. The version prefix is in the path so a v2 pack can ship beside
  # v1 rather than replacing it.
  assets:
    - assets/content/v1/contracts.json
    - assets/content/v1/enemies.json
    - assets/content/v1/items.json
    - assets/content/v1/locations.json
    - assets/content/v1/profiles.json
    - assets/content/v1/projects.json
    - assets/content/v1/recipes.json
    - assets/content/v1/resource_nodes.json
    - assets/content/v1/rumors.json
    - assets/content/v1/skills.json
    - assets/content/v1/atlas/atlas_layout.json

    # Pixel content, v1. Same rule as content above, and for the same reason: an
    # undeclared file is an asset that does not exist, and a stray one is an
    # asset nobody reviewed.
    #
    # Every file here is drawn through `PixelAsset`, at an exact integer multiple
    # of its native size, with nearest-neighbour filtering (ART_DIRECTION L-18).
    # The native size lives in the widget, not in the path — there are
    # deliberately no 2.0x/ or 3.0x/ variant directories, because AssetImage
    # would resolve those by devicePixelRatio and change the intrinsic size out
    # from under the explicit width.
    #
    # Provenance and the temporary marks are in assets/ui/v1/README.md.
    - assets/ui/v1/nav_adventure.png
    - assets/ui/v1/nav_adventure_hi.png
    - assets/ui/v1/nav_character.png
    - assets/ui/v1/nav_character_hi.png
    - assets/ui/v1/nav_skills.png
    - assets/ui/v1/nav_skills_hi.png
    - assets/ui/v1/nav_inventory.png
    - assets/ui/v1/nav_inventory_hi.png
    - assets/ui/v1/nav_craft.png
    - assets/ui/v1/nav_craft_hi.png
    - assets/ui/v1/nav_world.png
    - assets/ui/v1/nav_world_hi.png
    - assets/ui/v1/glyph_steps.png
    - assets/ui/v1/glyph_steps_muted.png
    - assets/ui/v1/glyph_arrow.png
    - assets/ui/v1/skill_foraging.png
    - assets/ui/v1/skill_woodcutting.png
    - assets/ui/v1/skill_mining.png
    - assets/ui/v1/skill_smithing.png
    - assets/ui/v1/skill_cooking.png
    # The chassis frame (VAWO01, DECISIONS/0030). One frame family app-wide:
    # PanelSkins maps roles to it, so ~28 panels change material from this one
    # line and no call site moves. The sidecar chassis_64.json beside it is
    # build-time geometry for Scripts/art/check-tile-seam.js and is deliberately
    # NOT declared here — it must not ship in the bundle.
    - assets/ui/v1/frame/chassis_64.png

    # FMPO02 wave 2 — the interior materials. Ten 32-square tiles, drawn x2
    # through PanelSurfaces, one per screen family. These are the SECOND
    # identity axis DECISIONS/0029 named: a card differs from its neighbour by
    # what it is made of, never by a second border. Sidecar .json files beside
    # them are build-time geometry for Scripts/art/check-tile-seam.js and are
    # deliberately NOT declared — they must not ship in the bundle.
    - assets/ui/v1/surface/grain_journal_leaf.png
    - assets/ui/v1/surface/grain_oilcloth.png
    - assets/ui/v1/surface/grain_buckram.png
    - assets/ui/v1/surface/grain_leather.png
    - assets/ui/v1/surface/grain_bench_oak.png
    - assets/ui/v1/surface/grain_steel.png
    - assets/ui/v1/surface/grain_slate.png
    - assets/ui/v1/surface/grain_chart_vellum.png
    - assets/ui/v1/surface/grain_cork.png
    - assets/ui/v1/surface/grain_plan_linen.png

    # The bands — the THIRD axis. 384 x 48 pictures drawn x1 and clipped,
    # never tiled and never stretched (lib/ui/components/band_plate.dart).
    # band_combat_kit is declared and deliberately not drawn: the combat
    # screen's picture is its stage, and a band above it would be a second
    # picture competing with the first. Recorded in band_plate.dart.
    - assets/ui/v1/band/band_forge.png
    - assets/ui/v1/band/band_cookfire.png
    - assets/ui/v1/band/band_bench.png
    - assets/ui/v1/band/band_foraging.png
    - assets/ui/v1/band/band_mining.png
    - assets/ui/v1/band/band_world_chart.png
    - assets/ui/v1/band/band_encounter_ground.png
    - assets/ui/v1/band/band_adventure_trail.png
    - assets/ui/v1/band/band_boards_batten.png
    - assets/ui/v1/band/band_combat_kit.png

    # The two button plates, drawn through PixelFrame as nine-patches at the
    # geometry MEASURED from each PNG (ButtonPlates in panel_skin.dart).
    - assets/ui/v1/button/btn_plate.png
    - assets/ui/v1/button/btn_compact.png

    # The two chrome edges, tiled horizontally at period 8 through EdgeStrip:
    # the nav bar's welt where a 1 px border was, and the header's shelf
    # where the 24 %-alpha region hairline was.
    - assets/ui/v1/nav/nav_welt.png
    # EPO03 — the welt re-cut as the header shelf's own stitch (DIR-15 §2), 8 × 6
    # at ×2 = 12 dp, the shelf's exact height, so the bar and the header are
    # terminated by one chassis rather than by two different edges. nav_welt
    # (8 × 4) stays declared until the tab bar's rebuild is accepted on the
    # device; it is the fallback the registry reverts to.
    - assets/ui/v1/nav/nav_welt_v2.png
    # EPO03 — the kit. Furniture inside a panel, not a panel's own border: two
    # wells, the combat stage frame, two rule tiles, the station rail and the
    # folio index tab. The three frames came from create_image_pro with an
    # accepted grain tile as the style reference — pixen could not draw a flat
    # axis-aligned hollow frame in 32 attempts and pro did it in the first call.
    # Geometry is MEASURED per file and mirrored in the .json sidecars beside
    # them, which are build-time only and deliberately NOT declared here.
    - assets/ui/v1/kit/inset_well.png
    - assets/ui/v1/kit/slot_well.png
    - assets/ui/v1/kit/stage_frame.png
    - assets/ui/v1/kit/rule_journal.png
    - assets/ui/v1/kit/rule_chart.png
    - assets/ui/v1/kit/rail_shelf.png
    - assets/ui/v1/kit/tab_plate.png
    - assets/ui/v1/header/header_shelf.png
    # The notable-card grain (FMPO02 wave 2, PROD-REWARDS). A 32² seamless
    # parchment tile drawn under a card body only when the result is notable.
    - assets/ui/v1/surface/grain_notable_plate.png
    # The combat HUD (FMPO02 wave 2, PROD-COMBAT-STAGE). Interface chrome for
    # the fight screen: one gauge frame, the turn tab, the narration tile, the
    # three command plates and their glyphs. Packaged and declared here; the
    # stage geometry that draws them is a separate task, and the nine-patch
    # numbers each was built to are in assets/ui/v1/README.md. Retreat has no
    # icon on purpose — ART-09 §5 specifies it as a plain text link.
    - assets/ui/v1/combat/hp_gauge_frame.png
    - assets/ui/v1/combat/turn_marker.png
    - assets/ui/v1/combat/narration_strip.png
    - assets/ui/v1/combat/plate_attack.png
    - assets/ui/v1/combat/plate_brace.png
    - assets/ui/v1/combat/plate_eat.png
    - assets/ui/v1/combat/icon_attack.png
    - assets/ui/v1/combat/icon_brace.png
    - assets/ui/v1/combat/icon_eat.png

    # Game art, v1. Authored in PixelLab, packaged by

# Project Stride — CI
#
# Three jobs. The point of the macOS job is the standing instruction in
# DECISIONS/0010: the iOS branch must not be allowed to remain uncompiled until
# the end. A build nobody runs still catches compile breaks, API drift, and a
# stale Pigeon contract — which is most of the value.
#
# Linux runners are used for Dart and Android rather than Windows: they are
# faster and cheaper on GitHub-hosted runners, and nothing in the Dart or
# Android toolchain is Windows-specific. Local development remains on Windows,
# and Scripts/verify.sh runs there via Git Bash.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  # ---------------------------------------------------------------------------
  # The simulation. No Flutter, no emulator, no platform. Should be seconds.
  # ---------------------------------------------------------------------------
  core:
    name: Dart core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        working-directory: packages/stride_core
        run: dart pub get

      - name: Analyze
        working-directory: packages/stride_core
        run: dart analyze --fatal-infos

      - name: Core purity
        run: ./Scripts/check-core-purity.sh

      - name: Test
        working-directory: packages/stride_core
        run: dart test

  # ---------------------------------------------------------------------------
  # Guards the two rules that are cheap to state and easy to erode.
  # ---------------------------------------------------------------------------
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Risk X-01. A third-party health aggregation package must never own
      # reconciliation, anchors, deletion handling, or ledger semantics.
      # Also asserts stride_core declares no Flutter dependency — the purity
      # rule made structural, not merely tested. DECISIONS/0010.
      - name: Dependency policy
        run: ./Scripts/check-dependency-policy.sh

  # ---------------------------------------------------------------------------
  # The app and the Android adapter. Everything here is what the owner can also
  # run interactively on Windows.
  # ---------------------------------------------------------------------------
  app-android:
    name: Flutter + Android
    runs-on: ubuntu-latest
    needs: [core]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Compares only the generated files, not the whole tree, and relies on the
      # Pigeon version being pinned in pubspec.yaml — otherwise a tool upgrade
      # fails this step for header-comment churn unrelated to a stale contract.
      # Compares only the generated files, and relies on the Pigeon version
      # being pinned exactly in stride_health/pubspec.yaml — otherwise a tool
      # upgrade fails this step for header churn unrelated to a stale contract.
      - name: Verify Pigeon output is current
        working-directory: packages/stride_health
        run: |
          GENERATED="lib/src/messages.g.dart \
                     android/src/main/kotlin/com/projectstride/stride_health/Messages.g.kt \
                     ios/stride_health/Sources/stride_health/Messages.g.swift"
          dart run pigeon --input pigeons/health_api.dart
          if ! git diff --quiet -- $GENERATED; then
            echo "::error::Pigeon-generated files are stale. Regenerate and commit:"
            echo "::error::  cd packages/stride_health && dart run pigeon --input pigeons/health_api.dart"
            git diff --stat -- $GENERATED
            exit 1
          fi
          echo "pigeon: up to date"

      # Hand-written Dart only. Pigeon output is not dart-format clean, and
      # formatting it would fail the drift check above on the next regeneration.
      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib test \
            packages/stride_core/lib packages/stride_core/test \
            packages/stride_health/lib/stride_health.dart \
            packages/stride_health/lib/src/mock_step_provider.dart \
            packages/stride_health/lib/src/platform_step_provider.dart \
            packages/stride_health/test \
            packages/stride_health/pigeons \
            packages/stride_health/example/lib \
            packages/stride_health/example/integration_test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Widget and unit tests
        run: flutter test

      - name: stride_health tests
        working-directory: packages/stride_health
        run: flutter test

      # Compiles the Kotlin adapter by building its host app. Driven through
      # `flutter build` rather than ./gradlew: Flutter's generated
      # android/.gitignore excludes the Gradle wrapper, which Flutter
      # regenerates on build, so a raw gradlew call fails on a fresh checkout.
      #
      # Behavioral Health Connect tests arrive with the real implementation in
      # S-01. This step is compile-only.
      - name: Android adapter compilation
        working-directory: packages/stride_health/example
        run: flutter build apk --debug

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stride-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # iOS. Compilation and adapter unit tests only — no signing, no simulator UI
  # tests, no TestFlight. Those need real Mac access and Apple credentials.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS compile
    runs-on: macos-latest
    needs: [core]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Compiles the app and the Swift HealthKit adapter. No signing, no
      # simulator UI tests, no TestFlight — those need real Mac access and
      # Apple credentials.
      #
      # This job is the whole point of DECISIONS/0010's standing instruction:
      # the iOS branch must not be allowed to remain uncompiled until the end.
      # A build nobody runs still catches compile breaks, API drift, and a
      # stale Pigeon contract.
      - name: Build iOS (unsigned)
        run: flutter build ios --no-codesign --debug

      - name: Build the plugin host app (compiles the Swift adapter)
        working-directory: packages/stride_health/example
        run: flutter build ios --no-codesign --debug

# Project Stride — CI
#
# Four jobs, per DECISIONS/0010 and the M-4 specification.
#
# The macOS job exists to honour a standing instruction: the iOS branch must not
# be allowed to remain uncompiled until the end. A build nobody runs still
# catches compile breaks, API drift, and a stale Pigeon contract — which is most
# of the value, and all of it available without a Mac on the desk.
#
# Linux runners carry the Dart and Android work: faster and cheaper than Windows
# on GitHub-hosted runners, and nothing in either toolchain is Windows-specific.
# Local development stays on Windows via Scripts/verify.sh.
#
# No production signing anywhere. No TestFlight. Those need real Mac access and
# Apple credentials (DECISIONS/0011).

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege, declared rather than inherited.
#
# The repository is public, so `pull_request` runs fork-authored code. GitHub's
# default token for a fork PR is already read-only, but that is a repository
# *setting* someone can change; this is the workflow stating what it needs.
#
# Nothing here writes to the repository: no releases, no PR comments, no package
# publishing, no commits. Read access to contents is the whole requirement. If a
# future job needs more, it should request it at the JOB level, not here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  # Pinned, not floating. A REPRODUCIBILITY fix, not a Flutter upgrade.
  #
  # `channel: stable` alone follows whatever stable is on the day. When stable
  # moved 3.44.8 -> 3.47.0, `dart format` changed its output and the format
  # check began failing on three files nobody had touched since early August —
  # on master as much as on any branch. A run's result then depended on the
  # date it happened to be started, which is the one thing CI evidence may not
  # depend on.
  #
  # 3.44.8 is the version the repository is formatted against and the version
  # the owner develops on. Those two agreeing is the property being pinned.
  #
  # Not a decision to stay here. A deliberate 3.47 upgrade — reformat, full
  # suite, its own branch — is worth doing and is recorded as a follow-up in
  # PROJECT_STATE.md. Doing it inside a HealthKit defect fix would have meant
  # a toolchain bump landing in the same commit as the evidence meant to
  # validate the fix.
  FLUTTER_VERSION: 3.44.8
  JAVA_VERSION: '17'

jobs:
  # ===========================================================================
  # 1. Dart / core
  # ===========================================================================
  core:
    name: Dart core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: |
          flutter pub get
          (cd packages/stride_core && dart pub get)
          (cd packages/stride_storage && dart pub get)
          (cd packages/stride_health && flutter pub get)
          (cd packages/stride_health/example && flutter pub get)
          (cd packages/stride_secure_store && flutter pub get)
          (cd packages/stride_secure_store/example && flutter pub get)

      # Cheap, specific guards run first. A developer who adds a health package
      # should see 'prohibited health package', not a generic analyzer error
      # three steps later.
      - name: Core purity guard
        run: bash ./Scripts/check-core-purity.sh

      - name: Dependency policy guard
        run: bash ./Scripts/check-dependency-policy.sh

      # Was local-only via Scripts/verify.sh until F-06, which meant the one
      # privacy control with no in-code enforcement also had no CI enforcement.
      # A manifest edit on a branch nobody ran verify.sh against would have
      # merged green.
      - name: Storage privacy and backup exclusion guard
        run: bash ./Scripts/check-backup-exclusions.sh

      # The guards read XML, plists and entitlements with a real parser, not
      # grep. Installed deliberately and deterministically: `npm ci` fails
      # rather than resolving anything the lockfile does not name, and no
      # lifecycle script from any package runs. See DEPENDENCIES.md.
      #
      # `verify.sh` does NOT do this for you -- a verification run that
      # silently downloads code has made a network fetch part of "is this
      # repository correct?".
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bootstrap guard tooling
        run: bash ./Scripts/bootstrap-tooling.sh

      # The parsers themselves, before anything depends on them. 32 fixtures
      # covering namespace-URI resolution under renamed prefixes, multi-line
      # comments, the tri-state exit contract, DOCTYPE policy, and the two
      # defects found while wiring this in: `parses` vs the plist-only `keys`,
      # and `attr-ns` element narrowing.
      - name: Guard parser fixtures
        run: bash ./Scripts/check-guard-parsers.sh

      # Never ran in CI or in verify.sh before this commit, and three of its
      # checks called an xmlq mode that does not exist -- every call exited 2
      # into `|| true`, so tools:overrideLibrary, the manifest uses-sdk floor,
      # and the background <service>/<receiver> check were all dead from the
      # day they were written.
      - name: Android target policy guard
        run: bash ./Scripts/check-android-target.sh --self-test

      # The single-writer architecture rule (DECISIONS/0013). Nothing at runtime
      # serializes two isolates, so this guard IS the guarantee -- not a
      # reminder about one.
      #
      # `--self-test` injects three violations and asserts each is rejected, so
      # the guard is continuously proven able to fail. Two earlier guards in
      # this repository passed while blind, both because they counted instead of
      # anchoring; a guard that has never been falsified is not evidence.
      - name: Single-writer persistence guard
        run: bash ./Scripts/check-single-writer.sh --self-test

      # DECISIONS/0014: the repository held two parallel step-ingestion models
      # and the platform boundary was wired to the one nothing used. A flat
      # total cannot express per-origin attribution, scoped completeness, or
      # partial pages, so an adapter satisfying it could not satisfy the core.
      # This guard is what keeps there being exactly one model.
      #
      # `--self-test` is a mutation test: it injects each of the violations
      # separately and asserts each is rejected.
      - name: One step-ingestion model
        run: bash ./Scripts/check-step-model.sh --self-test

      # Origin keying happens natively, before the value crosses Pigeon, so no
      # raw platform identifier reaches Dart at all. That is a property of
      # source text across Dart, Swift, and Kotlin -- no type can hold it.
      #
      # `--self-test` injects ten violations, at least one per rule.
      - name: Origin privacy guard
        run: bash ./Scripts/check-origin-privacy.sh --self-test

      # Runs on Linux deliberately: these are text assertions over the Xcode
      # project, the Info.plist and the entitlements file, so they need no Mac
      # and should fail in seconds rather than 17 minutes into the macOS job.
      #
      # The background-delivery entitlement is checked for ABSENCE. S-01A is
      # foreground only (DECISIONS/0014); adding that key alone would let iOS
      # wake the app into a second execution context outside the single-writer
      # persistence model, with no Dart code changing.
      - name: iOS target and foreground HealthKit guard
        run: bash ./Scripts/check-ios-target.sh --self-test

      # Hand-written Dart only. Pigeon output is not dart-format clean, and
      # formatting it would fail the drift check in the `pigeon` job on the next
      # regeneration.
      - name: Format check
        run: |
          dart format --output=none --set-exit-if-changed \
            lib test integration_test \
            packages/stride_storage/lib packages/stride_storage/test \
            packages/stride_core/lib packages/stride_core/test \
            packages/stride_health/lib/stride_health.dart \
            packages/stride_health/lib/src/cursor_authorization.dart \
            packages/stride_health/lib/src/mock_step_source.dart \
            packages/stride_health/lib/src/origin_gateway.dart \
            packages/stride_health/lib/src/origin_pseudonymizer.dart \
            packages/stride_health/lib/src/platform_step_source.dart \
            packages/stride_health/lib/src/step_sync_source.dart \
            packages/stride_health/test \
            packages/stride_health/tool \
            packages/stride_health/pigeons \
            packages/stride_health/example/lib \
            packages/stride_health/example/integration_test \
            packages/stride_secure_store/lib/stride_secure_store.dart \
            packages/stride_secure_store/lib/src/secure_identity_store.dart \
            packages/stride_secure_store/lib/src/keychain_identity_store.dart \
            packages/stride_secure_store/lib/src/fake_secure_identity_store.dart \
            packages/stride_secure_store/test \
            packages/stride_secure_store/pigeons \
            packages/stride_secure_store/example/lib

      - name: Analyze (fatal warnings and infos)
        run: flutter analyze --fatal-infos --fatal-warnings

      # The simulation. No Flutter, no emulator. Should be seconds.
      - name: stride_core tests
        working-directory: packages/stride_core
        run: dart test

      - name: stride_storage analyze and test
        working-directory: packages/stride_storage
        run: |
          dart analyze --fatal-infos
          # Serial: this suite measures lock contention and process-death
          # timing, so parallel files make it contend with itself.
          dart test -j 1

      # -----------------------------------------------------------------------
      # F-06: the concurrency proofs, named explicitly, on Linux.
      #
      # The step above already runs these files. They are named again here for
      # one reason: POSIX `fcntl` locks are owned by the PROCESS, so Linux is
      # the only runner on which the shipping platform's real lock semantics
      # are exercised. A green Windows run proves the opposite of what it looks
      # like -- Windows `LockFileEx` is per-handle and refuses a second isolate,
      # so the development machine reports an exclusion that Android does not
      # have.
      #
      # `--reporter expanded` puts the caveat probe's observation -- whether a
      # second ISOLATE in one process is granted a lock the first already holds
      # -- into the CI log, where it is evidence rather than folklore. Windows
      # reports `refused` and Linux reports `acquired`; that difference IS the
      # finding, so the probe records it and asserts no locking outcome.
      #
      # A SKIP IS NOT A PASS. Neither file skips anything, conditionally or
      # otherwise, and this step fails if that ever changes: a platform-guarded
      # skip here would silently retire the only proof that runs on the
      # semantics we actually ship.
      - name: stride_storage concurrency proofs (Linux, no skips allowed)
        working-directory: packages/stride_storage
        run: |
          set -o pipefail
          dart test -j 1 --reporter expanded \
            test/linux_lock_semantics_test.dart \
            test/closure_probes_test.dart | tee "$RUNNER_TEMP/concurrency-proofs.log"
          # `dart test` reports a skip two ways and neither uses the word
          # "skipped": an indented `Skip: <reason>` line, and a `~N` count in
          # the summary. Both are matched, because matching only the summary
          # would miss a skip in a run that also failed.
          if grep -qE '^[[:space:]]*Skip:|~[0-9]+:' "$RUNNER_TEMP/concurrency-proofs.log"; then
            echo "::error::A concurrency proof was skipped on Linux. Linux fcntl semantics are what these tests exist to prove; a skip here is not a pass."
            grep -nE '^[[:space:]]*Skip:|~[0-9]+:' "$RUNNER_TEMP/concurrency-proofs.log"
            exit 1
          fi

      - name: App tests
        run: flutter test

      - name: stride_health Dart tests
        working-directory: packages/stride_health
        run: flutter test

      # The port contract and the Pigeon translation. Not the Keychain: that
      # needs the macOS job, and the iCloud restore this all exists for needs
      # two physical iPhones and is verified nowhere.
      - name: stride_secure_store Dart tests
        working-directory: packages/stride_secure_store
        run: flutter test

  # ===========================================================================
  # 2. Pigeon — the platform contract must be identical on all three sides
  # ===========================================================================
  pigeon:
    name: Pigeon bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: |
          (cd packages/stride_health && flutter pub get)
          (cd packages/stride_secure_store && flutter pub get)

      # Compares only the generated files, and relies on the Pigeon version
      # being pinned exactly in each plugin's pubspec.yaml. Without the pin, a
      # tool upgrade fails this for header churn unrelated to a stale contract.
      - name: Regenerate and verify health bindings
        working-directory: packages/stride_health
        run: |
          GENERATED="lib/src/messages.g.dart \
                     android/src/main/kotlin/com/projectstride/stride_health/Messages.g.kt \
                     ios/stride_health/Sources/stride_health/Messages.g.swift"
          dart run pigeon --input pigeons/health_api.dart
          if ! git diff --quiet -- $GENERATED; then
            echo "::error::Pigeon bindings are stale. Regenerate and commit:"
            echo "::error::  cd packages/stride_health && dart run pigeon --input pigeons/health_api.dart"
            git diff -- $GENERATED
            exit 1
          fi
          echo "pigeon: health Dart, Kotlin, and Swift bindings all match"

      # The second surface. Two sides only -- there is no Kotlin, because the
      # plugin is iOS-only: Android keeps app-private identity storage and its
      # declarative backup exclusions, per the owner's F-06 closure ruling.
      - name: Regenerate and verify secure-store bindings
        working-directory: packages/stride_secure_store
        run: |
          GENERATED="lib/src/messages.g.dart \
                     ios/stride_secure_store/Sources/stride_secure_store/Messages.g.swift"
          dart run pigeon --input pigeons/secure_store_api.dart
          if ! git diff --quiet -- $GENERATED; then
            echo "::error::Secure-store Pigeon bindings are stale. Regenerate and commit:"
            echo "::error::  cd packages/stride_secure_store && dart run pigeon --input pigeons/secure_store_api.dart"
            git diff -- $GENERATED
            exit 1
          fi
          echo "pigeon: secure-store Dart and Swift bindings match"

  # ===========================================================================
  # 3. Android — debug builds and JVM unit tests. No production signing.
  # ===========================================================================
  android:
    name: Android
    runs-on: ubuntu-latest
    needs: [core, pigeon]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: |
          flutter pub get
          (cd packages/stride_health/example && flutter pub get)

      # Debug signing only — the Flutter default. No keystore, no secrets.
      - name: Build application debug APK
        run: flutter build apk --debug

      # Also compiles the Kotlin adapter and the Pigeon-generated Kotlin, since
      # the plugin is built as a dependency of its host app.
      - name: Build health-plugin example debug APK
        working-directory: packages/stride_health/example
        run: flutter build apk --debug

      # The Gradle wrapper is excluded by Flutter's generated android/.gitignore
      # and regenerated on build, so this must run after the build above.
      - name: Kotlin adapter unit tests
        working-directory: packages/stride_health/example/android
        run: ./gradlew :stride_health:testDebugUnitTest --no-daemon

      # The BUILT ARTIFACT declares minSdkVersion 26.
      #
      # Every other minSdk check in this repository reads SOURCE -- gradle
      # files and manifests. That is necessary and not sufficient: the value
      # that reaches a phone is the one in the merged manifest inside the APK,
      # and it can differ from every source file through manifest merging, a
      # variant override, or a Flutter default winning a precedence argument
      # nobody expected. The 55,200-step defect and the dead-guard defects in
      # this repository share one shape -- a control that looked live and
      # checked something adjacent to the real thing.
      #
      # `aapt2 dump badging` reads the compiled binary manifest. Failing closed:
      # if the line cannot be found at all, that is a failure, not a pass.
      #
      # ## The line is `minSdkVersion:`, not `sdkVersion:`
      #
      # This grepped `^sdkVersion:` and could therefore NEVER match. That is the
      # aapt **v1** spelling; aapt2 emits `minSdkVersion:'26'`. Verified against
      # build-tools 36.0.0 and 36.1.0, both of which print `minSdkVersion:` and
      # no `sdkVersion:` line at all, and against CI's 37.0.0, where the step
      # failed with "no sdkVersion in the badging output" -- never reaching a
      # comparison.
      #
      # So this check had no working path: it could only ever fail closed. It
      # went unnoticed because the Android job is gated behind `core`, and the
      # one run that reached this step failed here immediately. Failing closed
      # is what made it a loud defect instead of a silent one -- had it been
      # written `|| true`, it would have joined the dead checks this repository
      # has already been bitten by twice.
      - name: Prove the built APK declares minSdkVersion 26
        run: |
          set -euo pipefail
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          [ -n "$AAPT2" ] || { echo "::error::aapt2 not found"; exit 1; }
          echo "using $AAPT2"

          check_apk() {
            local apk="$1" label="$2"
            [ -f "$apk" ] || { echo "::error::$label: $apk was not built"; exit 1; }
            local line
            line="$("$AAPT2" dump badging "$apk" | grep -E "^minSdkVersion:" || true)"
            [ -n "$line" ] || { echo "::error::$label: no minSdkVersion in the badging output"; exit 1; }
            local got
            got="$(printf '%s' "$line" | sed -E "s/^minSdkVersion:'([0-9]+)'.*/\1/")"
            echo "$label -> $line"
            if [ "$got" != "26" ]; then
              echo "::error::$label declares minSdkVersion $got in the BUILT ARTIFACT, not 26."
              echo "::error::Source may say 26 while manifest merging produces something else."
              exit 1
            fi
            echo "$label: built artifact declares minSdkVersion 26"
          }

          check_apk build/app/outputs/flutter-apk/app-debug.apk "application APK"
          check_apk packages/stride_health/example/build/app/outputs/flutter-apk/app-debug.apk "health example APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stride-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          # A debug APK is a throwaway build artifact, ~70 MB, superseded by the
          # next push. On a public repository it is also publicly downloadable,
          # so a short life is both hygiene and storage.
          retention-days: 7

  # ===========================================================================
  # 4. macOS / iOS — compilation only. No signing, no TestFlight.
  # ===========================================================================
  ios:
    name: iOS compile
    runs-on: macos-latest
    needs: [core, pigeon]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve Flutter dependencies
        run: |
          flutter pub get
          (cd packages/stride_core && dart pub get)
          (cd packages/stride_health && flutter pub get)
          (cd packages/stride_health/example && flutter pub get)
          (cd packages/stride_secure_store && flutter pub get)
          (cd packages/stride_secure_store/example && flutter pub get)

      - name: Regenerate and verify Pigeon output
        run: |
          verify() {
            local dir="$1" input="$2"; shift 2
            (cd "$dir" && dart run pigeon --input "$input")
            local generated=()
            for f in "$@"; do generated+=("$dir/$f"); done
            if ! git diff --quiet -- "${generated[@]}"; then
              echo "::error::Pigeon bindings are stale on macOS ($dir)."
              git diff -- "${generated[@]}"
              exit 1
            fi
          }
          verify packages/stride_health pigeons/health_api.dart \
            lib/src/messages.g.dart \
            android/src/main/kotlin/com/projectstride/stride_health/Messages.g.kt \
            ios/stride_health/Sources/stride_health/Messages.g.swift
          verify packages/stride_secure_store pigeons/secure_store_api.dart \
            lib/src/messages.g.dart \
            ios/stride_secure_store/Sources/stride_secure_store/Messages.g.swift
          echo "pigeon: both surfaces verified on macOS"

      # Platform-neutral tests, re-run here so a macOS-specific Dart regression
      # cannot hide behind a green Linux job.
      - name: Platform-neutral tests
        run: |
          (cd packages/stride_core && dart test)
          flutter test
          (cd packages/stride_health && flutter test)
          (cd packages/stride_secure_store && flutter test)

      # --no-codesign: compiles and links without any signing identity. The
      # binary is not installable, which is the point — this proves the code
      # builds, not that it ships.
      - name: Compile iOS application shell
        run: flutter build ios --no-codesign --debug

      # Compiles the Swift HealthKit adapter and the generated Swift bindings by
      # building their host app.
      - name: Compile Swift health adapter
        working-directory: packages/stride_health/example
        run: flutter build ios --no-codesign --debug

      # Compiles the Swift Keychain and backup-exclusion code by building its
      # host app. The main application above also links this plugin, so a
      # compile break shows up twice -- but only here does it come with a test
      # target.
      - name: Compile Swift secure-store adapter
        working-directory: packages/stride_secure_store/example
        run: flutter build ios --no-codesign --debug

      # ---------------------------------------------------------------------
      # Simulator tests for the device-bound identity.
      #
      # The simulator has a real Keychain and a real filesystem, so these do
      # genuinely exercise SecItemAdd/CopyMatching/Delete, the
      # kSecAttrAccessible value, and NSURLIsExcludedFromBackupKey on real
      # paths -- including re-application after the directory is recreated.
      #
      # They also prove the invariant the project guarantees: after every
      # create, write, rename, replacement and compaction, the file at the
      # final path is excluded once the per-write hook has run. An atomic write
      # and a rename over the top are separately confirmed to DESTROY the
      # attribute, which is why the hook exists at all. See
      # packages/stride_secure_store/BACKUP_EXCLUSION_CONTRACT.md.
      #
      # THEY DO NOT PROVE THE THING THIS FEATURE EXISTS FOR. That a
      # ThisDeviceOnly item is omitted from an encrypted iCloud backup, and
      # that the backup exclusion is honoured, are properties of Apple's backup
      # implementation. No runner and no simulator can perform an iCloud backup
      # and restore onto a second device. A locked-device read
      # (errSecInteractionNotAllowed) is also unreachable: a simulator is never
      # locked.
      #
      # ## Code signing, and why it is not NO here
      #
      # The compile steps above pass --no-codesign deliberately: they prove the
      # code builds, and an unsigned binary is the honest artifact for that.
      #
      # The TEST step cannot do the same. iOS gates every SecItem* call on the
      # calling process's entitlements, and the entitlements are attached at
      # signing time. With CODE_SIGNING_ALLOWED=NO the test host is unsigned,
      # carries no `application-identifier`, and every Keychain call returns
      # errSecMissingEntitlement (-34018) before it reaches any of the logic
      # under test. Signing ad-hoc for the simulator (`CODE_SIGN_IDENTITY=-`,
      # requirement off, no team, no profile) is what Xcode itself does for an
      # ordinary local simulator run.
      #
      # This changes nothing about what is proven: an ad-hoc signature is not a
      # distribution signature, and no step in this workflow produces an
      # installable build.
      # ---------------------------------------------------------------------

      # A diagnostic, not a gate. Runs the entitlement probe against a
      # deliberately UNSIGNED host so the OSStatus an unsigned host gets from
      # the Keychain is in the log as a number rather than as an assumption in
      # a comment. It is EXPECTED TO FAIL, and continue-on-error keeps that off
      # the job result.
      #
      # The probe asserts rather than prints. Run 30771670303 established that
      # stdout from the test process does not reach xcodebuild's streamed log
      # -- the first version of this step greped for lines the probe had
      # printed and found none, because they never left the simulator. An
      # XCTest assertion failure does reach the log, so the numbers ride out on
      # a failure message.
      #
      # Delete this step once the -34018 finding is old news: it costs a build.
      - name: Keychain entitlement probe (unsigned host, expected to fail)
        continue-on-error: true
        working-directory: packages/stride_secure_store/example/ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print(next(x['name'] for v in d.values() for x in v if 'iPhone' in x['name']))")
          echo "Simulator: $DEVICE"
          set +e
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -only-testing:RunnerTests/KeychainEntitlementProbe \
            -resultBundlePath "$RUNNER_TEMP/probe-unsigned.xcresult" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/probe-unsigned.log" 2>&1
          echo "xcodebuild exit: $? (a non-zero exit here is the expected result)"

          echo "--- what an unsigned test host gets from the Keychain ---"
          bash "$GITHUB_WORKSPACE/packages/stride_secure_store/tool/xcresult-failures.sh" \
            "$RUNNER_TEMP/probe-unsigned.xcresult"

          echo "--- failing test names, from the streamed log ---"
          grep -a -A 6 "^Failing tests:" "$RUNNER_TEMP/probe-unsigned.log" | head -20 || true

      - name: Swift secure-store tests (simulator Keychain, no iCloud)
        working-directory: packages/stride_secure_store/example/ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print(next(x['name'] for v in d.values() for x in v if 'iPhone' in x['name']))")
          echo "Simulator: $DEVICE"

          # Not -quiet, and captured rather than streamed. -quiet suppresses the
          # per-suite result lines, and those are the only cheap evidence that
          # the suites ran at all. The full log is kept out of the CI output
          # unless something fails.
          if ! xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath "$RUNNER_TEMP/secure-store-tests.xcresult" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            > "$RUNNER_TEMP/secure-store-tests.log" 2>&1; then
            echo "::error::Swift secure-store tests failed."

            # The assertion text is the only thing worth reading here, and it
            # is NOT in this log. The Xcode on macos-latest writes failing test
            # NAMES to stdout and puts every message in the result bundle
            # instead -- established the expensive way across runs 30769049772,
            # 30771670303 and 30772473185. So the messages, which by convention
            # in this suite always carry the numeric OSStatus, are read out of
            # the bundle.
            echo "--- assertion messages (from the result bundle) ---"
            bash "$GITHUB_WORKSPACE/packages/stride_secure_store/tool/xcresult-failures.sh" \
              "$RUNNER_TEMP/secure-store-tests.xcresult"

            echo "--- which tests failed ---"
            grep -a -A 40 "^Failing tests:" \
              "$RUNNER_TEMP/secure-store-tests.log" | head -60 || true

            echo "--- tail ---"
            tail -200 "$RUNNER_TEMP/secure-store-tests.log"
            exit 1
          fi

          # Printed on the green path too. The probe's numbers and the recorded
          # platform observations are evidence, and evidence that only appears
          # when something breaks is evidence nobody has checked.
          echo "--- recorded observations and probe results ---"
          bash "$GITHUB_WORKSPACE/packages/stride_secure_store/tool/xcresult-failures.sh" \
            "$RUNNER_TEMP/secure-store-tests.xcresult"

          # A green xcodebuild is not the same claim as "the suites ran". A test
          # target that builds and hosts nothing exits zero, and so does a
          # scheme whose testables were dropped -- which is exactly how a
          # security control comes to be enforced by a suite nobody notices is
          # empty. These four names are the enforcement.
          #
          # This guard used to grep for "Test Suite '<name>' passed" and was
          # therefore dead: run 30771670303 passed all forty tests and failed
          # here, because the toolchain on macos-latest emits
          #   Test suite '<name>' started on '<device>'
          #   Test case '<name>.<test>()' passed on '<device>' (0.001 seconds)
          #   ** TEST SUCCEEDED **
          # and no per-suite result line in any case. The old pattern could
          # only ever have matched on a red run that never reached it. Both
          # spellings are accepted now so a toolchain change breaks this loudly
          # rather than silently.
          #
          # "Started" alone is not enough either -- a suite can start and
          # contain nothing -- so each name must also account for at least one
          # executed case and zero failed ones.
          LOG="$RUNNER_TEMP/secure-store-tests.log"
          for suite in SecureStoreTests BackupExclusionTests SecureStoreAdapterTests KeychainEntitlementProbe; do
            if ! grep -qE "Test [Ss]uite '$suite' (started|passed)" "$LOG"; then
              echo "::error::$suite did not run. The device-bound identity and"
              echo "::error::the backup exclusion are unverified on this build."
              exit 1
            fi
            ran=$(grep -acE "Test [Cc]ase '($suite\.|-\[$suite )" "$LOG" || true)
            if [ "${ran:-0}" -lt 1 ]; then
              echo "::error::$suite started but executed no test cases."
              exit 1
            fi
            bad=$(grep -acE "Test [Cc]ase '($suite\.|-\[$suite )[^']*' failed" "$LOG" || true)
            if [ "${bad:-0}" -ne 0 ]; then
              echo "::error::$suite reported $bad failed case line(s) despite a zero exit."
              exit 1
            fi
            echo "$suite: $ran case result line(s), 0 failed"
          done

          # The belt to that pair of braces. If xcodebuild ever exits zero
          # without having succeeded, this is the line that notices.
          grep -q '\*\* TEST SUCCEEDED \*\*' "$LOG" ||
            { echo "::error::xcodebuild exited 0 but never printed TEST SUCCEEDED."; exit 1; }

      # Uploaded unconditionally. A failure whose detail only exists inside a
      # runner that has already been destroyed costs a full CI cycle to
      # re-learn, and this job's cycle is a quarter of an hour.
      - name: Upload secure-store test logs and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-store-test-output
          path: |
            ${{ runner.temp }}/secure-store-tests.log
            ${{ runner.temp }}/secure-store-tests.xcresult
            ${{ runner.temp }}/probe-unsigned.log
            ${{ runner.temp }}/probe-unsigned.xcresult
          if-no-files-found: warn
          # Diagnostic output for one run, not an archive. `.xcresult` bundles
          # reach ~90 MB and are only ever read while investigating that run.
          retention-days: 7

      # Simulator-hosted unit tests. Nothing here requests HealthKit
      # authorization: an interactive permission prompt cannot be answered on a
      # CI runner, and asserting against real health data needs a physical
      # device (task V-02b).
      - name: Swift unit tests (no HealthKit authorization required)
        working-directory: packages/stride_health/example/ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print(next(x['name'] for v in d.values() for x in v if 'iPhone' in x['name']))")
          echo "Simulator: $DEVICE"
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

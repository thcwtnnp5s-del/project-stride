# Project Stride — CI
#
# Three jobs. The point of the macOS job is the standing instruction in
# DECISIONS/0010: the iOS branch must not be allowed to remain uncompiled until
# the end. A build nobody runs still catches compile breaks, API drift, and a
# stale Pigeon contract — which is most of the value.
#
# Linux runners are used for Dart and Android rather than Windows: they are
# faster and cheaper on GitHub-hosted runners, and nothing in the Dart or
# Android toolchain is Windows-specific. Local development remains on Windows,
# and Scripts/verify.sh runs there via Git Bash.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  # ---------------------------------------------------------------------------
  # The simulation. No Flutter, no emulator, no platform. Should be seconds.
  # ---------------------------------------------------------------------------
  core:
    name: Dart core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        working-directory: packages/stride_core
        run: dart pub get

      - name: Verify formatting
        working-directory: packages/stride_core
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: packages/stride_core
        run: dart analyze --fatal-infos

      - name: Core purity
        run: ./Scripts/check-core-purity.sh

      - name: Test
        working-directory: packages/stride_core
        run: dart test

  # ---------------------------------------------------------------------------
  # Guards the two rules that are cheap to state and easy to erode.
  # ---------------------------------------------------------------------------
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Risk X-01. A third-party health aggregation package must never own
      # reconciliation, anchors, deletion handling, or ledger semantics.
      # DECISIONS/0010.
      - name: No third-party health aggregation package
        run: |
          if grep -rnE '^\s+(health|health_kit|flutter_health_fit|fitkit|google_fit)\s*:' \
               --include=pubspec.yaml . ; then
            echo "::error::A third-party health package is prohibited. Health"
            echo "::error::integration is first-party in packages/stride_health."
            echo "::error::See DECISIONS/0010_CROSS_PLATFORM_STACK.md."
            exit 1
          fi
          echo "dependency policy: OK"

      # stride_core must not declare a Flutter dependency at all — the purity
      # rule made structural, not merely tested.
      - name: stride_core declares no Flutter dependency
        run: |
          if grep -qE '^\s+flutter\s*:' packages/stride_core/pubspec.yaml; then
            echo "::error::stride_core must not depend on Flutter."
            exit 1
          fi
          echo "core independence: OK"

  # ---------------------------------------------------------------------------
  # The app and the Android adapter. Everything here is what the owner can also
  # run interactively on Windows.
  # ---------------------------------------------------------------------------
  app-android:
    name: Flutter + Android
    runs-on: ubuntu-latest
    needs: [core]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Compares only the generated files, not the whole tree, and relies on the
      # Pigeon version being pinned in pubspec.yaml — otherwise a tool upgrade
      # fails this step for header-comment churn unrelated to a stale contract.
      - name: Verify Pigeon output is current
        run: |
          GENERATED="packages/stride_health/lib/src/messages.g.dart \
                     packages/stride_health/android/src/main/kotlin/Messages.g.kt \
                     packages/stride_health/ios/Classes/Messages.g.swift"
          dart run pigeon --input packages/stride_health/pigeons/health_api.dart
          if ! git diff --quiet -- $GENERATED; then
            echo "::error::Pigeon-generated files are stale. Regenerate and commit:"
            echo "::error::  dart run pigeon --input packages/stride_health/pigeons/health_api.dart"
            git diff --stat -- $GENERATED
            exit 1
          fi
          echo "pigeon: up to date"

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Widget and unit tests
        run: flutter test

      - name: Health Connect adapter unit tests
        working-directory: packages/stride_health/android
        run: ./gradlew test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stride-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # iOS. Compilation and adapter unit tests only — no signing, no simulator UI
  # tests, no TestFlight. Those need real Mac access and Apple credentials.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS compile
    runs-on: macos-latest
    needs: [core]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --no-codesign --debug

      - name: HealthKit adapter compilation and unit tests
        working-directory: packages/stride_health/example/ios
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -quiet

name: stride_core
description: >-
  Project Stride game rules and simulation. Pure Dart, deterministic, with no
  dependency on Flutter, plugins, the file system, or the clock.
version: 0.1.0
publish_to: 'none'

# This package MUST NOT declare a dependency on `flutter`.
#
# The rule is structural here, and enforced by test/core_purity_test.dart, by
# Scripts/check-core-purity.sh, and by the dependency-policy job in CI.
#
# When the core needs a platform capability, define a port in lib/src/ports/ and
# implement it in the app or in stride_health. Do not add a dependency here.
#
# See DECISIONS/0010_CROSS_PLATFORM_STACK.md.

environment:
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.0
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

  # Dev only, and it must stay that way. stride_storage carries `dart:io`, and
  # it depends on this package -- so this is a dependency cycle that pub permits
  # precisely because dev dependencies are not transitive and never reach a
  # release build.
  #
  # It is here for one reason: test/conformance_memory_test.dart runs the shared
  # persistence-port conformance suite against the in-memory device, so the fast
  # in-memory implementation and the real filesystem one are held to a single
  # definition of correct rather than two that drift.
  stride_storage:
    path: ../stride_storage

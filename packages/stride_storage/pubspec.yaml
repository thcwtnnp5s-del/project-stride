name: stride_storage
description: >-
  Device-local persistence for Project Stride. Concrete `dart:io` adapters for
  the pure-Dart ports defined by stride_core, plus the reusable conformance
  suite every implementation of those ports must pass.
version: 0.1.0
publish_to: 'none'

# This package exists so `stride_core` can stay free of `dart:io`.
#
# It deliberately does NOT depend on Flutter. Everything here is testable by
# `dart test` against a real temporary directory, on any platform, with no
# emulator and no device — which is the only reason the filesystem behaviour is
# verifiable at all from a Windows development machine.
#
# The Flutter-specific pieces (rootBundle, path_provider) live in the app.

environment:
  sdk: ^3.12.2

dependencies:
  stride_core:
    path: ../stride_core

  # A regular dependency, not a dev dependency, and deliberately so.
  #
  # lib/conformance.dart is a *library*, not a test file: it is the single
  # definition of the persistence-port conformance suite, and it is executed by
  # test files in this package AND in stride_core. A suite under test/ cannot be
  # imported by another package, and a suite written twice is two suites that
  # will eventually disagree — with the one that drifts being the one nobody
  # runs on a device.
  #
  # Acceptable because stride_storage is internal (publish_to: none) and the
  # suite sits behind its own entry point, so importing
  # package:stride_storage/stride_storage.dart from the app pulls in no test
  # framework.
  test: ^1.25.0

dev_dependencies:
  lints: ^6.0.0
